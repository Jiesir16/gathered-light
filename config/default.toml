# 默认配置（≈ application.yml）。env 变量 APP_*__* 会覆盖此处。

bind_addr = "0.0.0.0:8080"

[database]
url      = "postgres://postgres:postgres@localhost:5432/gathered_light"
pool_min = 2
pool_max = 16

[redis]
url       = "redis://localhost:6379/0"
pool_size = 8

[s3]
# ⚠ endpoint 必须地域级、不带桶名（对：cos.<region>.myqcloud.com / 错：<bucket>.cos...）。
# 带桶名 + force_path_style 会把桶名写进对象 key，换自定义域名后干净路径 403。详见 .env.example。
endpoint         = "http://localhost:9000"
# 自定义域名：填了之后 public 直链 / 签名链 / 直传 PUT 全走它，前端看不到 COS 源站 host 与桶名。
public_base_url  = ""                       # 生产例：https://media.example.com
region           = "us-east-1"
bucket           = "gathered-light"
upload_max_bytes = 26214400      # 25 MiB

[jwt]
access_ttl_secs  = 900           # 15 min
refresh_ttl_secs = 604800        # 7 days
secret           = "dev-secret-change-me"
