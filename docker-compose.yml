# dev 偏好：所有数据 bind mount 到仓库根 ./data/
# 优点：rm -rf data/<svc> 一秒重置；tar 整个 ./data 即可备份；进度可见
# .gitignore 已屏蔽 ./data/
services:
  postgres:
    image: postgres:18-alpine
    container_name: gathered-pg
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: gathered_light
    ports: ["5432:5432"]
    # ⚠️ PG 18+ 改了挂载约定：必须挂 /var/lib/postgresql（PG 自己管理 18/main 子目录），
    # 挂 /var/lib/postgresql/data 会立即 Exited(1) 并报 "(unused mount/volume)"。
    volumes:
      - ./data/postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gathered_light"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: gathered-redis
    ports: ["6379:6379"]
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ./data/redis:/data

  minio:
    image: minio/minio:latest
    container_name: gathered-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9000:9000", "9001:9001"]
    command: server /data --console-address ":9001"
    volumes:
      - ./data/minio:/data
